name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  shared:
    name: "Shared code"
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./garanti
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.14.0"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
  erlang:
    name: "Erlang runner"
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./garanti_erlang
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.14.0"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
  javascript:
    name: "JavaScript runner"
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: ./garanti_javascript
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.14.0"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
